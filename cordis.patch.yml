# dsh-intelligent-ui bundle layer: the plugin's two rows.
# This file is the `dsh.bundle.patch` layer (see package.json#dsh.bundle.patch).
# Layer semantics: a YAML array of row verbs; `insert` adds plugin rows to the
# composed config. A row's `id` must be unique within the layer stack; `name`
# resolves the plugin module through the installed package's exports.
- insert:
    # The tool row: `ui_render` and, through package.json#dsh.client, the cards.
    - id: dsh-intelligent-ui
      name: dsh-intelligent-ui
    # The skill row: the bundled skill, listed as its own part with its own switch.
    - id: dsh-intelligent-ui-skill
      name: dsh-intelligent-ui/skill
